<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- Primary SEO -->
    <title>Strongest Governor – Kingshot Event Calculator</title>
    <meta
      name="description"
      content="Kingshot Strongest Governor event calculator. Plan buildings, troops, heroes, gear, gathering and track event points."
    />
    <meta
      name="keywords"
      content="Kingshot, Strongest Governor, calculator, event points, Rise of Kingdoms style, hero stars, gathering"
    />
    <meta name="author" content="Kingshot Calculator" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0d6e62" />
    <meta name="color-scheme" content="dark light" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Security / privacy (also set by server Helmet when API is used) -->
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.cdnfonts.com; img-src 'self' data: blob: https:; font-src 'self' data: https://cdnjs.cloudflare.com https://fonts.cdnfonts.com; connect-src 'self' https: http://localhost:5000; object-src 'none'; base-uri 'self'; form-action 'self';" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
<meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), payment=()" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Strongest Governor – Kingshot Calculator" />
    <meta
      property="og:description"
      content="Plan upgrades, shards, gathering and event points for Kingshot Strongest Governor."
    />
    <meta property="og:site_name" content="Kingshot Calculator" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Strongest Governor – Kingshot Calculator" />
    <meta
      name="twitter:description"
      content="Kingshot event calculator for buildings, troops, heroes, gear and gathering points."
    />

    <!-- PWA-ish -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kingshot Calc" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/favicon.ico" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
